name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate plugin with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 300000 `
            --validate "build\MadScaler_artefacts\Release\VST3\MadScaler.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\MadScaler_artefacts\Release\VST3\MadScaler.vst3" dist\
          Copy-Item "build\MadScaler_artefacts\Release\Standalone\MadScaler.exe" dist\
          Copy-Item docs\ROUTING.md dist\

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: MadScaler-Windows
          path: dist
